<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 · 专注计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fff5f3 0%, #ffe8e4 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(231, 76, 60, 0.12);
    padding: 40px 48px;
    text-align: center;
    width: 360px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 24px; }
  .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .modes button {
    border: 1px solid #eee;
    background: #fafafa;
    color: #666;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .modes button.active { background: #e74c3c; border-color: #e74c3c; color: #fff; }
  .ring { position: relative; width: 220px; height: 220px; margin: 0 auto 24px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .time {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .time .num { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .time .label { font-size: 13px; color: #999; margin-top: 4px; }
  .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
  .controls button {
    border: none; border-radius: 999px; cursor: pointer; font-size: 15px;
    padding: 12px 28px;
  }
  #startBtn { background: #e74c3c; color: #fff; }
  #resetBtn { background: #f5f5f5; color: #666; }
  .stats { font-size: 13px; color: #888; }
  .stats b { color: #e74c3c; }
</style>
</head>
<body>
  <div class="card">
    <h1>🍅 番茄钟</h1>
    <p class="sub">专注 25 分钟，休息 5 分钟</p>
    <div class="modes">
      <button data-min="25" class="active">专注 25 分钟</button>
      <button data-min="5">短休息 5 分钟</button>
      <button data-min="15">长休息 15 分钟</button>
    </div>
    <div class="ring">
      <svg width="220" height="220">
        <circle cx="110" cy="110" r="100" fill="none" stroke="#f3e2df" stroke-width="10"/>
        <circle id="progress" cx="110" cy="110" r="100" fill="none" stroke="#e74c3c"
                stroke-width="10" stroke-linecap="round"
                stroke-dasharray="628.3" stroke-dashoffset="0"/>
      </svg>
      <div class="time">
        <div class="num" id="clock">25:00</div>
        <div class="label" id="stateLabel">准备开始</div>
      </div>
    </div>
    <div class="controls">
      <button id="startBtn">开始</button>
      <button id="resetBtn">重置</button>
    </div>
    <p class="stats">今日已完成 <b id="doneCount">0</b> 个番茄</p>
  </div>
<script>
  const CIRC = 628.3;
  let total = 25 * 60, left = total, timer = null, running = false;
  let done = 0, currentMode = '专注';
  const clock = document.getElementById('clock');
  const label = document.getElementById('stateLabel');
  const progress = document.getElementById('progress');
  const startBtn = document.getElementById('startBtn');

  function fmt(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function render() {
    clock.textContent = fmt(left);
    progress.style.strokeDashoffset = CIRC * (1 - left / total);
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.start();
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      o.stop(ctx.currentTime + 0.6);
    } catch (e) {}
  }
  function finish() {
    clearInterval(timer); running = false; startBtn.textContent = '开始';
    beep();
    if (currentMode === '专注') {
      done++;
      document.getElementById('doneCount').textContent = done;
      label.textContent = '专注完成，休息一下吧';
    } else {
      label.textContent = '休息结束，继续专注';
    }
  }
  startBtn.addEventListener('click', () => {
    if (running) {
      clearInterval(timer); running = false;
      startBtn.textContent = '继续'; label.textContent = '已暂停';
    } else {
      running = true; startBtn.textContent = '暂停';
      label.textContent = currentMode + '进行中';
      timer = setInterval(() => {
        left--;
        render();
        if (left <= 0) finish();
      }, 1000);
    }
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    clearInterval(timer); running = false; left = total;
    startBtn.textContent = '开始'; label.textContent = '准备开始'; render();
  });
  document.querySelectorAll('.modes button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      clearInterval(timer); running = false;
      total = parseInt(btn.dataset.min, 10) * 60; left = total;
      currentMode = btn.dataset.min === '25' ? '专注' : '休息';
      startBtn.textContent = '开始'; label.textContent = '准备开始'; render();
    });
  });
  render();
</script>
</body>
</html>
